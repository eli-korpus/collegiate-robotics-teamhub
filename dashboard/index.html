<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%TEAMHUB_THEME_COLOR%" />
    <title>%TEAMHUB_TITLE%</title>
    %TEAMHUB_ICONS%
    <script>
      // Apply the theme before first paint (per-device preference, spec §9.2).
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('teamhub-theme') || '%TEAMHUB_DEFAULT_MODE%'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TeamHub needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
